#Servicios de Wizard Support
services:
  #Base de datos
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wizard
      POSTGRES_PASSWORD: wizard_pass
      POSTGRES_DB: wizard_support
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  #Backend API
  support-service:
    build: ./support-service
    ports:
      - "8000:8000"
    env_file:
      - ./support-service/.env
    depends_on:
      - db

  #Worker de outbox
  worker:
    build: ./support-service
    command: python -m app.worker.outbox_worker
    env_file:
      - ./support-service/.env
    depends_on:
      - db

  #Frontend Angular
  web:
    build: ./web
    ports:
      - "4200:80"
    depends_on:
      - support-service

#Volumen persistente para PostgreSQL
volumes:
  pgdata: